name: Desktop release

on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Upload verified assets to a draft GitHub Release (never publishes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  MUSICOS_RELEASE_REPOSITORY: HenryTheAddict/MusicOS
  MUSICOS_UPDATER_PUBLIC_KEY: ${{ vars.MUSICOS_UPDATER_PUBLIC_KEY }}

jobs:
  model:
    name: Fetch the pinned Sparklist model
    if: github.repository == 'HenryTheAddict/MusicOS' && !github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download and verify the pinned Sparklist model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/desktop-model
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/629370311" > out/desktop-model/model.tar.gz
          node --input-type=module -e 'import {createHash} from "node:crypto"; import {readFileSync} from "node:fs"; if (createHash("sha256").update(readFileSync(process.argv[1])).digest("hex") !== "cf720c9932d370c23e38d6f43b16395677e102a946cee876b3c2994a1f02a6c3") throw Error("Sparklist archive checksum mismatch")' out/desktop-model/model.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sparklist-model
          path: out/desktop-model/model.tar.gz
          if-no-files-found: error
          retention-days: 1

  bundle:
    needs: model
    if: github.repository == 'HenryTheAddict/MusicOS' && !github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-aarch64
            bundles: app,dmg
          - runner: macos-15-intel
            platform: darwin-x86_64
            bundles: app,dmg
          - runner: ubuntu-22.04
            platform: linux-x86_64
            bundles: appimage
          - runner: windows-2025
            platform: windows-x86_64
            bundles: nsis
    name: Bundle ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set Mac deployment target
        if: runner.os == 'macOS'
        run: echo 'MACOSX_DEPLOYMENT_TARGET=14.0' >> "$GITHUB_ENV"
      - name: Check out pinned Intel ONNX Runtime source
        if: matrix.platform == 'darwin-x86_64'
        uses: actions/checkout@v4
        with:
          repository: microsoft/onnxruntime
          ref: 402979ac1bef89dcd55add41eaa7277c407599eb
          path: out/onnxruntime-source
          submodules: recursive
          persist-credentials: false
      - name: Build Intel ONNX Runtime
        if: matrix.platform == 'darwin-x86_64'
        run: |
          test "$(uname -m)" = x86_64
          test "$(cat out/onnxruntime-source/VERSION_NUMBER)" = 1.31.0
          out/onnxruntime-source/build.sh --config Release --build_shared_lib --parallel 3 \
            --compile_no_warning_as_error \
            --cmake_extra_defines CMAKE_OSX_ARCHITECTURES=x86_64 CMAKE_OSX_DEPLOYMENT_TARGET=14.0
          cp out/onnxruntime-source/build/MacOS/Release/libonnxruntime.1.31.0.dylib src-tauri/resources/runtime/
          mkdir -p third_party/licenses/onnxruntime-macos-x86_64
          cp out/onnxruntime-source/LICENSE out/onnxruntime-source/ThirdPartyNotices.txt third_party/licenses/onnxruntime-macos-x86_64/
      - name: Verify Mac runtime architecture and minimum OS
        if: runner.os == 'macOS'
        run: |
          runtime=src-tauri/resources/runtime/libonnxruntime.1.31.0.dylib
          test "$(lipo -archs "$runtime")" = "$(uname -m)"
          otool -l "$runtime" | tee out/onnxruntime-load-commands.txt
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('out/onnxruntime-load-commands.txt').read_text()
          versions = re.findall(r'^\s*minos\s+(\d+\.\d+(?:\.\d+)?)$', text, re.MULTILINE)
          assert versions and all(tuple(map(int, v.split('.'))) <= (14, 0, 0) for v in versions), versions
          PY
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libfuse2
      - name: Stage Linux runtime and AppImage tools
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          python3 scripts/linux/prepare-runtime.py
          python3 scripts/linux/prepare-appimage-tools.py
      - name: Stage Windows runtime
        if: runner.os == 'Windows'
        run: python scripts/prepare-windows-runtime.py
      - uses: actions/download-artifact@v4
        with:
          name: sparklist-model
          path: out/desktop-model
      - name: Verify and stage the pinned Sparklist model
        run: |
          node --input-type=module -e 'import {createHash} from "node:crypto"; import {readFileSync} from "node:fs"; if (createHash("sha256").update(readFileSync(process.argv[1])).digest("hex") !== "cf720c9932d370c23e38d6f43b16395677e102a946cee876b3c2994a1f02a6c3") throw Error("Sparklist archive checksum mismatch")' out/desktop-model/model.tar.gz
          tar -xzf out/desktop-model/model.tar.gz -C out/desktop-model
      - run: npm ci
      - name: Configure updater trust
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          npm run product:check
          node scripts/desktop-release.mjs config "$PLATFORM"
      - name: Build and sign installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          BUNDLES: ${{ matrix.bundles }}
          PLATFORM: ${{ matrix.platform }}
          MUSICOS_SPARK_MODEL_SOURCE: ${{ github.workspace }}/out/desktop-model/clap-general-v1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo 'Set the source repository TAURI_SIGNING_PRIVATE_KEY secret before building a release.' >&2
            exit 1
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            export LIBCLANG_PATH='C:\Program Files\LLVM\bin'
          fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            if [[ "$PLATFORM" == darwin-x86_64 ]]; then
              for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
                if [[ -z "${!name}" || "${!name}" == - ]]; then
                  echo "Intel Mac releases require $name for Developer ID signing and notarization." >&2
                  exit 1
                fi
              done
            fi
            if [[ -z "$APPLE_CERTIFICATE" && -z "$APPLE_SIGNING_IDENTITY" ]]; then
              export APPLE_SIGNING_IDENTITY=-
            fi
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [[ -z "${!name}" ]]; then unset "$name"; fi
            done
          fi
          npm run tauri -- build --ci --bundles "$BUNDLES" --config out/desktop-release/tauri.conf.json -- --locked
      - name: Verify Intel Developer ID signature and notarization
        if: matrix.platform == 'darwin-x86_64'
        run: |
          codesign --verify --deep --strict --verbose=2 target/release/bundle/macos/musicOS.app
          spctl --assess --type execute --verbose=2 target/release/bundle/macos/musicOS.app
          xcrun stapler validate target/release/bundle/dmg/*.dmg
      - name: Stage signed bundles
        env:
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/desktop-release.mjs stage "$PLATFORM"
      - name: Build and install-test Arch package
        if: runner.os == 'Linux'
        run: |
          version=$(node scripts/desktop-release.mjs version)
          mkdir -p out/arch-package
          cp "out/desktop-release/assets/musicOS_${version}_linux-x86_64.AppImage" out/arch-package/musicOS.AppImage
          export MUSICOS_VERSION="$version"
          export MUSICOS_APPIMAGE_SHA256
          MUSICOS_APPIMAGE_SHA256=$(sha256sum out/arch-package/musicOS.AppImage | cut -d ' ' -f 1)
          docker run --rm -e MUSICOS_VERSION -e MUSICOS_APPIMAGE_SHA256 \
            -v "$PWD/out/arch-package:/build" -v "$PWD/scripts/linux/arch:/recipe:ro" \
            archlinux:latest bash /recipe/build.sh
          cp out/arch-package/*.pkg.tar.zst out/desktop-release/assets/
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: out/desktop-release/assets/
          if-no-files-found: error

  release:
    name: Verify release and prepare handoff
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify all packages and write updater manifest
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign zstd
          node scripts/desktop-release.mjs manifest release-assets
          (cd release-assets && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: verified-desktop-release
          path: release-assets/
          if-no-files-found: error
      - name: Create draft release in MusicOS
        if: inputs.create_draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node scripts/desktop-release.mjs version)
          visibility=$(gh repo view "$MUSICOS_RELEASE_REPOSITORY" --json isPrivate --jq .isPrivate)
          test "$visibility" = false || { echo 'The configured update repository must be public.' >&2; exit 1; }
          gh release create "v$version" release-assets/* --repo "$MUSICOS_RELEASE_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --title "musicOS $version" \
            --notes "Desktop installers for macOS (Apple Silicon and Intel, macOS 14+), Windows (x64), and Linux (x64 AppImage and Arch package). Arch: install with pacman -U; update through pacman rather than the AppImage updater."
