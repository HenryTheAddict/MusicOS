name: Desktop release

on:
  workflow_dispatch:
    inputs:
      create_draft:
        description: Upload verified assets to a draft GitHub Release (never publishes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  MUSICOS_RELEASE_REPOSITORY: HenryTheAddict/MusicOS
  MUSICOS_UPDATER_PUBLIC_KEY: ${{ vars.MUSICOS_UPDATER_PUBLIC_KEY }}

jobs:
  bundle:
    if: github.repository == 'HenryTheAddict/MusicOS' && !github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write # Required to download the pinned model from a draft release.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-aarch64
            bundles: app,dmg
          - runner: ubuntu-22.04
            platform: linux-x86_64
            bundles: appimage
          - runner: windows-2025
            platform: windows-x86_64
            bundles: nsis
    name: Bundle ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libfuse2
      - name: Stage Linux runtime and AppImage tools
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          python3 scripts/linux/prepare-runtime.py
          python3 scripts/linux/prepare-appimage-tools.py
      - name: Stage Windows runtime
        if: runner.os == 'Windows'
        run: python scripts/prepare-windows-runtime.py
      - name: Verify and stage the pinned Sparklist model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out/desktop-model
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/629370311" > out/desktop-model/model.tar.gz
          node --input-type=module -e 'import {createHash} from "node:crypto"; import {readFileSync} from "node:fs"; if (createHash("sha256").update(readFileSync(process.argv[1])).digest("hex") !== "cf720c9932d370c23e38d6f43b16395677e102a946cee876b3c2994a1f02a6c3") throw Error("Sparklist archive checksum mismatch")' out/desktop-model/model.tar.gz
          tar -xzf out/desktop-model/model.tar.gz -C out/desktop-model
      - run: npm ci
      - name: Configure updater trust
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          npm run product:check
          node scripts/desktop-release.mjs config "$PLATFORM"
      - name: Build and sign installers
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          BUNDLES: ${{ matrix.bundles }}
          MUSICOS_SPARK_MODEL_SOURCE: ${{ github.workspace }}/out/desktop-model/clap-general-v1
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo 'Set the source repository TAURI_SIGNING_PRIVATE_KEY secret before building a release.' >&2
            exit 1
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            export LIBCLANG_PATH='C:\Program Files\LLVM\bin'
          fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            if [[ -z "$APPLE_CERTIFICATE" && -z "$APPLE_SIGNING_IDENTITY" ]]; then
              export APPLE_SIGNING_IDENTITY=-
            fi
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              if [[ -z "${!name}" ]]; then unset "$name"; fi
            done
          fi
          npm run tauri -- build --ci --bundles "$BUNDLES" --config out/desktop-release/tauri.conf.json -- --locked
      - name: Stage signed bundles
        env:
          PLATFORM: ${{ matrix.platform }}
        run: node scripts/desktop-release.mjs stage "$PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: out/desktop-release/assets/
          if-no-files-found: error

  release:
    name: Verify release and prepare handoff
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Verify all packages and write updater manifest
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
          node scripts/desktop-release.mjs manifest release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: verified-desktop-release
          path: release-assets/
          if-no-files-found: error
      - name: Create draft release in MusicOS
        if: inputs.create_draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node scripts/desktop-release.mjs version)
          visibility=$(gh repo view "$MUSICOS_RELEASE_REPOSITORY" --json isPrivate --jq .isPrivate)
          test "$visibility" = false || { echo 'The configured update repository must be public.' >&2; exit 1; }
          gh release create "v$version" release-assets/* --repo "$MUSICOS_RELEASE_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --title "musicOS $version" \
            --notes "Desktop installers for macOS (Apple Silicon), Windows (x64), and Linux (x64 AppImage)."
