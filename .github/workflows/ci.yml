name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  native-control-center:
    name: Native Control Center (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install GPUI Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libwayland-dev

      - name: Check native Control Center
        run: cargo check -p musicos-desktop

      - name: Test native desktop services
        env:
          MUSICOS_TEST_AUDIO_BACKEND: ${{ runner.os == 'macOS' && 'system' || 'none' }}
        run: cargo test -p musicos-desktop --lib --no-default-features

      - name: Build native Control Center
        run: cargo build --release -p musicos-desktop --bin musicos-control-center

  windows:
    name: Windows build and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Rust workspace
        run: cargo check --workspace --exclude musicos-tauri --features desktop-app,desktop-audio

      - name: Test Rust workspace
        env:
          MUSICOS_TEST_AUDIO_BACKEND: none
        run: cargo test --workspace --exclude musicos-tauri --features desktop-app,desktop-audio

      - name: Build desktop binaries
        run: npm run build:legacy

      - name: Run 10,000-track performance acceptance
        env:
          MUSICOS_PERF_SKIP_BUILD: "1"
          MUSICOS_PERF_TRACKS: "10000"
        run: npm run perf:smoke

  react-tauri:
    name: React and Tauri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev ffmpeg
      - name: Stage Linux ONNX Runtime
        if: runner.os == 'Linux'
        run: python3 scripts/linux/prepare-runtime.py
      # Tauri tests generate their audio fixtures with FFmpeg. Homebrew's FFmpeg
      # has no libvorbis, so macOS also needs oggenc for the Vorbis copy test.
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg vorbis-tools
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: npm ci
      - run: npm run build
      - run: npm run test:tauri
        env:
          MUSICOS_TEST_AUDIO_BACKEND: none
      - run: npm run test:ui

  e2e:
    name: Browser integration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
