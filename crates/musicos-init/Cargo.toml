[package]
name = "musicos-init"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1.0"
bitflags = "2.6"
libc = "0.2"
log = "0.4"
rusttype = "0.9"
walkdir = "2.5"
rusqlite = { version = "0.32", features = ["bundled"] }
rodio = { version = "0.19", features = ["mp3", "wav", "vorbis", "flac", "symphonia-aac", "symphonia-isomp4"], optional = true }
tiny_http = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mp3-metadata = "0.3"
lofty = "0.21.1"
resvg = "0.47.0"
usvg = "0.47.0"
id3 = "0.6"
image = { version = "0.24", default-features = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
minifb = { version = "0.27", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.9", optional = true }
evdev = "0.12"
nix = { version = "0.29", features = ["fs", "mount", "reboot"] }

[[bin]]
name = "musicos-mac"
path = "src/bin/musicos-mac.rs"
required-features = ["desktop-app"]

[[bin]]
name = "musicos-snapshot"
path = "src/bin/musicos-snapshot.rs"

[[bin]]
name = "musicos-index"
path = "src/bin/musicos-index.rs"

[[bin]]
name = "musicos-sync"
path = "src/bin/musicos-sync.rs"
required-features = ["desktop-app"]

[[bin]]
name = "musicos-desktop"
path = "src/bin/musicos-desktop.rs"
required-features = ["desktop-app"]

[features]
default = []
audio = ["dep:rodio", "dep:alsa"]
desktop-app = ["dep:minifb"]
mac-app = ["desktop-app"]
pid1 = []
