[package]
name = "musicos-desktop"
version = "0.1.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "musicos-control-center"
path = "src/main.rs"
required-features = ["gpui-ui"]

[[bin]]
name = "musicos-agent"
path = "src/bin/musicos-agent.rs"

[features]
default = ["gpui-ui"]
gpui-ui = ["dep:gpui"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1.0"
async-channel = "2.5"
directories = "6.0"
gpui = { version = "=0.2.2", optional = true, features = ["runtime_shaders", "test-support"] }
image = "0.24"
log = "0.4"
lofty = "0.21.1"
musicos-init = { path = "../musicos-init", features = ["desktop-app", "desktop-audio"] }
notify = "8.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signalsmith-stretch = "=0.1.3"
rodio = { version = "0.19", default-features = false, features = ["symphonia-all", "desktop-seek-length"] }
rtrb = "=0.3.2"
rustfft = "6.4"
sha2 = "0.10"
tempfile = "3.20"
unicode-segmentation = "1.12"
walkdir = "2.5"

[dev-dependencies]
tiny_http = "0.12"

[build-dependencies]
cc = "1"

[package.metadata.packager]
product-name = "MusicOS Control Center"
identifier = "com.musicos.controlcenter"
category = "Music"
before-packaging-command = "cargo build --release -p musicos-desktop --bin musicos-control-center && cargo build --release -p musicos-init --bin musicos-mac --features desktop-app,desktop-audio"
binaries = [
    { path = "musicos-control-center", main = true },
    { path = "musicos-mac", main = false },
]

