[package]
name = "musicos-visualizer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde = { version="1", features=["derive"] }
serde_json = "1"
wgpu = { version="=25.0.2", default-features=false, features=["metal","glsl","wgsl"] }
naga = { version="=25.0.1", features=["glsl-in","wgsl-out"] }
raw-window-handle = "0.6"
bytemuck = { version="1", features=["derive"] }
pollster = "0.4"
