[workspace]
members = ["crates/musicos-init", "crates/musicos-desktop", "src-tauri", "crates/musicos-visualizer"]
exclude = ["out", "out/**", "out/qemu/build/musicos-init"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/HenryTheAddict/MusicOS"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
rodio = { path = "third_party/rodio" }
