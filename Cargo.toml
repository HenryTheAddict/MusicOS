[workspace]
members = ["crates/musicos-init", "crates/musicos-desktop", "src-tauri", "crates/musicos-visualizer", "ios/src-tauri", "ios/tauri-plugin-companion"]
exclude = ["out", "out/**", "out/qemu/build/musicos-init"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/HenryTheAddict/MusicOS"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
rodio = { path = "third_party/rodio" }

# The companion remains debuggable while its portable audio hot paths run at
# production speed. Do not make a song wait on unoptimized Vorbis decoding.
[profile.dev.package.musicos-ios]
opt-level = 2
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.symphonia-codec-vorbis]
opt-level = 3
[profile.dev.package.symphonia-format-ogg]
opt-level = 3
[profile.dev.package.symphonia-utils-xiph]
opt-level = 3
[profile.dev.package.symphonia-bundle-flac]
opt-level = 3
[profile.dev.package.hound]
opt-level = 3
