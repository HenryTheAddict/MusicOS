[package]
name = "tauri-plugin-companion"
version = "0.1.2"
authors = ["musicOS contributors"]
description = "Native offline musicOS companion services"
edition = "2024"
rust-version = "1.90"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-companion"

[dependencies]
tauri = { version = "2.12.1" }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.7.1", features = ["build"] }
